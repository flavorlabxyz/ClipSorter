[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-clip-sorter"
version = "0.1.5"
description = "Local, source-safe recipe footage review and clustering"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.26,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
ai = ["torch>=2.2,<3", "transformers>=4.45,<5"]
test = ["httpx>=0.27,<1"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
recipe-sorter = "recipe_sorter.cli:main"

[tool.setuptools.packages.find]
include = ["recipe_sorter*"]

[tool.setuptools.package-data]
recipe_sorter = ["frontend/*"]
